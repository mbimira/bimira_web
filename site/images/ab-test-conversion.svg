<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Landing page A/B test conversion comparison</title>
  <desc id="desc">Control converted at 12.04 percent and treatment at 11.88 percent. The confidence interval includes no difference.</desc>
  <rect width="1200" height="600" fill="#e0e7eb"/>
  <rect x="34" y="30" width="1132" height="540" rx="8" fill="#fbfaf6"/>
  <text x="80" y="95" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#176b87">LANDING PAGE EXPERIMENT</text>
  <text x="80" y="137" font-family="Arial,sans-serif" font-size="18" fill="#596b75">Conversion rate by assigned group</text>
  <line x1="210" y1="430" x2="990" y2="430" stroke="#9aaab0" stroke-width="2"/>
  <line x1="210" y1="210" x2="210" y2="430" stroke="#9aaab0" stroke-width="2"/>
  <g stroke="#d9e1df" stroke-width="2"><line x1="210" y1="320" x2="990" y2="320"/><line x1="210" y1="210" x2="990" y2="210"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#596b75"><text x="162" y="435">0%</text><text x="151" y="325">6%</text><text x="141" y="215">12%</text></g>
  <rect x="350" y="211" width="190" height="219" rx="4" fill="#176b87"/>
  <rect x="660" y="214" width="190" height="216" rx="4" fill="#ed765a"/>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="445" y="190" font-size="24" fill="#172b3b">12.04%</text><text x="755" y="193" font-size="24" fill="#172b3b">11.88%</text><text x="445" y="465" font-size="18" fill="#172b3b">CONTROL</text><text x="755" y="465" font-size="18" fill="#172b3b">TREATMENT</text></g>
  <rect x="80" y="500" width="1040" height="42" rx="3" fill="#f1f2eb"/>
  <text x="600" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#172b3b">−0.16 percentage points · p = 0.190 · no significant difference</text>
</svg>
